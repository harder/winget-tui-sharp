name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Cancel in-progress runs on new pushes to the same branch (saves runner time).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflow-lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Lint GitHub Actions workflows
        uses: rhysd/actionlint@v1.7.12

  linux-runtime-tests:
    name: Linux runtime tests
    needs: workflow-lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore tests/WingetTuiSharp.Tests.csproj

      - name: Build cross-platform application
        run: dotnet build WingetTuiSharp.csproj --no-restore --configuration Release --framework net10.0

      - name: Build tests
        run: dotnet build tests/WingetTuiSharp.Tests.csproj --no-restore --no-dependencies --configuration Release

      - name: Test
        run: dotnet test --project tests/WingetTuiSharp.Tests.csproj --no-build --configuration Release --verbosity normal --minimum-expected-tests 245

      - name: Graceful mock smoke
        run: |
          timeout 15s dotnet bin/Release/net10.0/winget-tui-sharp.dll --smoke 2> smoke.err
          if [ -s smoke.err ]; then
            echo "::error::Mock run produced stderr output"
            cat smoke.err
            exit 1
          fi

  build-and-test:
    needs: workflow-lint
    # Windows only — winget itself is Windows-only and Native AOT can't cross-OS publish
    # to win-* targets from Linux. Tests CAN run on Linux but only verify pure-data parser
    # logic, not the full deploy story. Stick to where the real builds happen.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'
          cache: true
          cache-dependency-path: |
            WingetTuiSharp.csproj
            tests/WingetTuiSharp.Tests.csproj

      - name: Compute CI build version
        id: version
        shell: bash
        run: |
          VERSION_PREFIX="$(grep -oPm1 '(?<=<Version>)[^<]+' WingetTuiSharp.csproj)"
          CI_VERSION="${VERSION_PREFIX}-ci.${GITHUB_RUN_NUMBER}+sha.${GITHUB_SHA::7}"
          echo "ci_version=$CI_VERSION" >> "$GITHUB_OUTPUT"

      - name: Restore
        run: dotnet restore tests/WingetTuiSharp.Tests.csproj

      - name: Build cross-platform application
        run: >
          dotnet build WingetTuiSharp.csproj
          --no-restore
          --configuration Release
          --framework net10.0
          /p:Version=${{ steps.version.outputs.ci_version }}
          /p:InformationalVersion=${{ steps.version.outputs.ci_version }}

      # Compile the WINGET_COM code path on every PR. Running that backend still requires
      # a Windows machine with WinGet available and is outside this compile-only gate.
      - name: Build Windows COM application
        run: >
          dotnet build WingetTuiSharp.csproj
          --no-restore
          --configuration Release
          --framework net10.0-windows10.0.26100.0
          /p:Version=${{ steps.version.outputs.ci_version }}
          /p:InformationalVersion=${{ steps.version.outputs.ci_version }}

      - name: Build tests
        run: >
          dotnet build tests/WingetTuiSharp.Tests.csproj
          --no-restore
          --no-dependencies
          --configuration Release
          /p:Version=${{ steps.version.outputs.ci_version }}
          /p:InformationalVersion=${{ steps.version.outputs.ci_version }}

      - name: Test
        run: dotnet test --project tests/WingetTuiSharp.Tests.csproj --no-build --configuration Release --verbosity normal --minimum-expected-tests 245

      # The app self-stops through its normal shutdown path. The outer deadline is only a
      # deadlock guard; force-kill is failure cleanup, never the successful path.
      - name: Graceful mock smoke
        shell: pwsh
        run: |
          $proc = Start-Process -FilePath "dotnet" -ArgumentList "bin/Release/net10.0/winget-tui-sharp.dll", "--smoke" -PassThru -RedirectStandardError err.log
          if (!$proc.WaitForExit(15000)) {
            Stop-Process -Id $proc.Id -Force
            Write-Host "::error::Mock run did not complete graceful shutdown within 15 seconds"
            exit 1
          }
          $proc.WaitForExit()
          if ($proc.ExitCode -ne 0) {
            Write-Host "::error::Mock run exited with code $($proc.ExitCode)"
            if ((Get-Item err.log).Length -gt 0) { Get-Content err.log }
            exit 1
          }
          if ((Get-Item err.log).Length -gt 0) {
            Write-Host "::error::Mock run produced stderr output"
            Get-Content err.log
            exit 1
          }

      - name: Upload CI build outputs
        uses: actions/upload-artifact@v4
        with:
          name: winget-tui-sharp-${{ steps.version.outputs.ci_version }}-win-build
          path: |
            bin/Release/net10.0/**
            tests/bin/Release/net10.0/**
          retention-days: 7
