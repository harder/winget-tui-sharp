name: Release

# Tag-driven release. To cut a release:
#
#   git tag v0.1.0
#   git push origin v0.1.0
#
# Builds win-x64 and win-arm64 AOT executables, packages them with the README and
# LICENSE into zips, computes SHA-256 checksums, and publishes a GitHub Release with
# all artifacts attached.
#
# No code signing — that requires an Azure Trusted Signing account. Users will see SmartScreen warnings until
# the binaries build enough reputation. The SHA256SUMS files let users verify integrity.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (without leading v, e.g. 0.1.0). Required for manual runs.'
        required: true

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  workflow-lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Lint GitHub Actions workflows
        uses: rhysd/actionlint@v1.7.12

  build:
    needs: workflow-lint
    name: Build ${{ matrix.rid }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        rid: [win-x64, win-arm64]
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'
          cache: true
          cache-dependency-path: |
            WingetTuiSharp.csproj
            tests/WingetTuiSharp.Tests.csproj

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          else
            REF="${GITHUB_REF#refs/tags/}"
            VERSION="${REF#v}"
          fi
          # Validate: digits-and-dots with optional prerelease suffix
          if ! echo "$VERSION" | grep -Eq '^[0-9A-Za-z.+-]+$'; then
            echo "::error::Invalid version: $VERSION"
            exit 2
          fi
          echo "Version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # -f selects the Windows TFM, which is what compiles in the COM backend (WINGET_COM)
      # and pulls the in-process WinGet engine into the publish folder. Without it, the
      # multi-targeted project wouldn't produce the COM build.
      - name: AOT publish ${{ matrix.rid }}
        run: >
          dotnet publish -c Release
          -f net10.0-windows10.0.26100.0
          -r ${{ matrix.rid }}
          -o publish/${{ matrix.rid }}
          /p:Version=${{ steps.version.outputs.version }}

      # Download B: a signed MSIX whose package identity lets the AOT exe reach the in-box
      # out-of-process WinGet server, shipping only the ~61 KB projection winmd (not the 7 MB
      # in-process engine). See com-activation.md. Built pack-only here; signed by the next step.
      - name: Build MSIX (download B)
        continue-on-error: true   # experimental; never block the exe/zip downloads
        shell: pwsh
        run: |
          $arch = "${{ matrix.rid }}" -replace '^win-', ''
          # Appx Version must be 4-part numeric with no prerelease suffix.
          $v = "${{ steps.version.outputs.version }}" -replace '[-+].*$', ''
          $p = @($v.Split('.')); while ($p.Count -lt 3) { $p += '0' }
          $msixVersion = ($p[0..2] -join '.') + '.0'
          $publisher = "${{ vars.MSIX_PUBLISHER }}"
          if (-not $publisher) { $publisher = 'CN=winget-tui-sharp (Dev)' }
          Write-Host "MSIX version=$msixVersion publisher=$publisher arch=$arch"
          ./packaging/build-msix.ps1 -Arch $arch -Version $msixVersion -Publisher $publisher

      # Sign the MSIX with Azure Trusted Signing when configured (see code-signing.md). vars.MSIX_PUBLISHER
      # must equal the certificate subject. Skipped when secrets are absent — the resulting MSIX is then
      # unsigned and installs only under Developer Mode, so configure signing before shipping B to users.
      - name: Detect Azure Trusted Signing configuration
        id: trusted-signing
        shell: pwsh
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
        run: |
          $configured = -not [string]::IsNullOrWhiteSpace($env:AZURE_CLIENT_ID)
          "configured=$($configured.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

      - name: Sign MSIX (Azure Trusted Signing)
        if: steps.trusted-signing.outputs.configured == 'true'
        continue-on-error: true
        uses: azure/trusted-signing-action@v2.0.0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}/dist
          files-folder-filter: msix
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Package artifacts
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $rid = "${{ matrix.rid }}"
          $bundleName = "winget-tui-sharp-$version-$rid"
          $exeSuffix = switch ($rid) {
            "win-x64" { "x64" }
            "win-arm64" { "arm64" }
            default { throw "Unexpected RID: $rid" }
          }

          New-Item -ItemType Directory -Path "dist" -Force | Out-Null

          # Bare-exe drop, named with the architecture so latest links from the
          # release page don't need to encode the version. NB: the exe on its own runs
          # on the CLI backend — the COM backend needs the in-process engine DLLs that
          # only the zip below bundles.
          Copy-Item "publish/$rid/winget-tui-sharp.exe" "dist/winget-tui-sharp-$exeSuffix.exe"

          # Portable bundle: the full publish output (exe + the in-process WinGet COM
          # engine — WindowsPackageManager.dll + Microsoft.Management.Deployment.InProc.dll
          # — so the COM backend activates) + docs, in a zip. Exclude the .pdb (symbols only).
          New-Item -ItemType Directory -Path "stage/$bundleName" -Force | Out-Null
          Copy-Item "publish/$rid/*"   "stage/$bundleName/" -Recurse -Exclude *.pdb
          Copy-Item "README.md"        "stage/$bundleName/"
          Copy-Item "LICENSE"          "stage/$bundleName/"
          Copy-Item "feature-gaps.md"  "stage/$bundleName/"
          Compress-Archive -Path "stage/$bundleName" -DestinationPath "dist/$bundleName.zip" -Force

          # Checksum manifest, alphabetized so diff is stable.
          $hashes = Get-ChildItem dist/* |
            Sort-Object Name |
            ForEach-Object {
              $h = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
              "$h  $($_.Name)"
            }
          $hashes | Out-File -Encoding ascii "dist/SHA256SUMS-$rid.txt"

          Write-Host "Produced:"
          Get-ChildItem dist | ForEach-Object { Write-Host "  $($_.Name)  ($([math]::Round($_.Length / 1MB, 2)) MB)" }

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.rid }}
          path: dist/
          retention-days: 14

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts/
          merge-multiple: true

      - name: List downloaded artifacts
        run: ls -lh artifacts/

      - name: Compose release notes
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          cat > release-notes.md <<EOF
          > ⚠️ **Proof of concept** Install / uninstall / upgrade / repair actions operate on your real package state. See [README](https://github.com/${{ github.repository }}#readme) before running on real systems.

          ## Downloads

          Three ways to run it; pick by how much you want the COM features (Verify, Repair, install preview, richer detail, live progress) vs. zero-install simplicity. See [com-activation.md](https://github.com/${{ github.repository }}/blob/main/com-activation.md).

          | File | Backend | Install | Notes |
          |------|---------|---------|-------|
          | \`winget-tui-sharp-${VERSION}-{x64,arm64}.msix\` | **COM** | yes (signed) | **Download B** — package identity → COM, smallest footprint. Requires the package to be signed (see below). |
          | \`winget-tui-sharp-${VERSION}-win-{x64,arm64}.zip\` | **COM** | no (portable) | Exe + in-process engine + docs. COM with no install, no signing — the no-fuss COM option. |
          | \`winget-tui-sharp-{x64,arm64}.exe\` | CLI | no (portable) | **Download A** — single exe, \`winget\` CLI backend, no COM features. |
          | \`SHA256SUMS-*.txt\` | — | — | Per-architecture checksums |

          ## Quick start

          - **Just run it (CLI):** download the \`.exe\` for your architecture and run it.
          - **COM, no install:** download the \`.zip\`, extract, run \`winget-tui-sharp.exe\` from the folder (the in-process engine sits beside it).
          - **COM, installed (MSIX):** download the \`.msix\` and double-click. *Unsigned MSIX builds install only with Developer Mode enabled; a properly signed release installs normally.*

          \`\`\`powershell
          # Verify a download (PowerShell)
          Get-FileHash .\winget-tui-sharp-x64.exe -Algorithm SHA256
          # Compare against SHA256SUMS-win-x64.txt
          \`\`\`

          The portable downloads aren't code-signed (POC) — on first run click SmartScreen's "More info" → "Run anyway", or \`Unblock-File\` the exe.
          EOF

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            artifacts/*.exe
            artifacts/*.zip
            artifacts/*.msix
            artifacts/SHA256SUMS-*.txt
          body_path: release-notes.md
          generate_release_notes: true
          append_body: true
          # false so an experimental MSIX that didn't build doesn't fail the release; the exe/zip/
          # sums always exist because this job only runs after `build` succeeds.
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
